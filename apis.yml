name: Enough
description: >-
  ENOUGH (brand name ABUNDA) is a food-technology company that produces mycoprotein
  through a zero-waste fermentation process, growing fungi on grain-derived sugars.
  Operating as a B2B ingredient supplier to retailers and food brands, ENOUGH makes
  nutrient-dense, sustainable meat and seafood alternatives — including burgers,
  chicken-style products, noodles, and snacks — that use dramatically less water and
  produce far less CO2 than conventional animal protein. The company operates one of
  the world's largest mycoprotein fermentation facilities and is backed by DCVC. This
  profile was added to the API Evangelist network as a portfolio lead; ENOUGH is a
  food-ingredient business and publishes no public developer API surface.
